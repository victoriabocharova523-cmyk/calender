<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ежедневник</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* ── DARK THEME (default) ── */
:root, [data-theme="dark"] {
  --bg:      #080914;
  --bg2:     #0d1022;
  --bg3:     #131729;
  --bg4:     #1a1f35;
  --border:  rgba(100,110,180,0.10);
  --border2: rgba(100,110,180,0.20);
  --violet:  #7b5ff5;
  --violet2: rgba(123,95,245,0.18);
  --gold:    #ffbe4a;
  --red:     #ff5272;
  --green:   #3dd68c;
  --text:    #d8dff8;
  --muted:   #525a80;
  --foot-bg: rgba(5,6,18,0.6);
  --today-bg:rgba(123,95,245,0.03);
  --hover-bg:rgba(123,95,245,0.05);
}

/* ── LIGHT THEME ── */
[data-theme="light"] {
  --bg:      #f0f2fc;
  --bg2:     #ffffff;
  --bg3:     #e8ecf8;
  --bg4:     #dde2f4;
  --border:  rgba(80,90,170,0.11);
  --border2: rgba(80,90,170,0.22);
  --violet:  #5a3de8;
  --violet2: rgba(90,61,232,0.10);
  --gold:    #c07a00;
  --red:     #d41f44;
  --green:   #1a9762;
  --text:    #17192e;
  --muted:   #7880ae;
  --foot-bg: rgba(232,236,248,0.88);
  --today-bg:rgba(90,61,232,0.04);
  --hover-bg:rgba(90,61,232,0.05);
}

/* color-scheme per theme for native inputs */
[data-theme="dark"]  { color-scheme: dark; }
[data-theme="light"] { color-scheme: light; }

/* ── BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background .28s, color .28s;
}

/* ────────────────────────────
   HEADER
──────────────────────────── */
.hdr {
  height: 52px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 20;
  transition: background .28s, border-color .28s;
}
.logo {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 21px; color: var(--gold); letter-spacing: -.3px;
  margin-right: 6px; white-space: nowrap; transition: color .28s;
}
.week-nav { display: flex; align-items: center; gap: 3px; }
.nbtn {
  background: none; border: 1px solid var(--border2); color: var(--muted);
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s;
}
.nbtn:hover { border-color: var(--violet); color: var(--violet); }
.week-lbl {
  font-size: 12px; font-weight: 500; color: var(--text);
  min-width: 155px; text-align: center; letter-spacing: -.2px;
  transition: color .28s;
}
.today-btn {
  background: none; border: 1px solid var(--border2); color: var(--muted);
  padding: 3px 11px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: 'DM Sans', sans-serif; transition: all .15s;
}
.today-btn:hover { border-color: var(--violet); color: var(--violet); }
.hdr-space { flex: 1; }

/* ── THEME TOGGLE ── */
.tog {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center;
}
.tog-track {
  position: relative;
  width: 52px; height: 28px;
  background: var(--bg4);
  border: 1px solid var(--border2);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 7px;
  transition: background .28s, border-color .28s;
}
.tog-icon { font-size: 11px; line-height: 1; z-index: 1; pointer-events: none; transition: opacity .2s; }
.tog-moon { opacity: 1; }
.tog-sun  { opacity: .35; }
[data-theme="light"] .tog-moon { opacity: .35; }
[data-theme="light"] .tog-sun  { opacity: 1; }
.tog-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px;
  background: var(--violet); border-radius: 50%;
  box-shadow: 0 1px 5px rgba(0,0,0,.28);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), background .28s;
}
[data-theme="light"] .tog-thumb { transform: translateX(22px); }

.add-btn {
  background: var(--violet); color: #fff; border: none;
  padding: 6px 16px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  transition: filter .15s, background .28s;
}
.add-btn:hover { filter: brightness(1.1); }

/* ────────────────────────────
   LAYOUT
──────────────────────────── */
.body { display: flex; flex: 1; overflow: hidden; }

/* ────────────────────────────
   SIDEBAR
──────────────────────────── */
.sidebar {
  width: 248px; flex-shrink: 0;
  background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: background .28s, border-color .28s;
}

/* mini calendar */
.mcal { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); transition: border-color .28s; }
.mcal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mcal-title { font-size: 12px; font-weight: 600; color: var(--text); transition: color .28s; }
.mcal-nav { display: flex; gap: 2px; }
.mcal-nbtn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  border-radius: 4px; font-size: 13px; transition: color .15s;
}
.mcal-nbtn:hover { color: var(--violet); }
.mcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.mcal-dow { font-size: 9px; font-weight: 600; color: var(--muted); text-align: center; padding: 3px 0; letter-spacing: .05em; transition: color .28s; }
.md {
  font-size: 10.5px; text-align: center; border-radius: 50%; cursor: pointer; color: var(--muted);
  transition: all .12s; position: relative;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin: auto;
}
.md:hover { background: var(--bg4); color: var(--text); }
.md.in-m  { color: var(--text); }
.md.is-today { background: var(--violet); color: #fff !important; }
.md.in-week:not(.is-today) { background: var(--violet2); color: var(--violet); border-radius: 4px; }
.md.has-t::after {
  content: ''; position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 3px; background: var(--violet); border-radius: 50%;
}
.md.is-today.has-t::after { background: rgba(255,255,255,.7); }

/* deadlines */
.upcoming { flex: 1; overflow-y: auto; padding: 14px; }
.sec-lbl {
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; transition: color .28s;
}
.dl-item {
  padding: 9px 10px 9px 12px; background: var(--bg3); border-radius: 7px; margin-bottom: 7px;
  cursor: pointer; border-left: 3px solid transparent; transition: background .13s;
}
.dl-item:hover { background: var(--bg4); }
.dl-item.overdue { border-left-color: var(--red); }
.dl-item.soon    { border-left-color: var(--gold); }
.dl-item.ok      { border-left-color: var(--green); }
.dl-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.dl-meta  { font-size: 10px; color: var(--muted); display: flex; gap: 6px; }
.dl-date  { font-family: 'IBM Plex Mono', monospace; }
.empty-msg { font-size: 11px; color: var(--muted); text-align: center; padding: 18px 0; }

/* ────────────────────────────
   MAIN / GRID
──────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.day-hdrs {
  display: grid; grid-template-columns: 52px repeat(7, 1fr);
  border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0;
  transition: background .28s, border-color .28s;
}
.dh-gutter {}
.dh {
  padding: 8px 6px 6px; text-align: center; border-left: 1px solid var(--border);
  cursor: pointer; transition: background .12s, border-color .28s;
}
.dh:hover { background: var(--bg3); }
.dh.is-today { background: var(--today-bg); }
.dh-name { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; transition: color .28s; }
.dh-num  { font-size: 20px; font-weight: 300; color: var(--text); line-height: 1.1; transition: color .28s; }
.dh.is-today .dh-num { color: var(--violet); font-weight: 600; }
.dh-tc   { font-size: 9px; color: var(--muted); margin-top: 1px; font-family: 'IBM Plex Mono', monospace; }

.grid-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; }
.grid { display: flex; }
.time-col { width: 52px; flex-shrink: 0; }
.tl {
  height: 64px; display: flex; align-items: flex-start;
  padding: 5px 8px 0 0; justify-content: flex-end;
  font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--muted); transition: color .28s;
}
.day-cols { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
.dc {
  position: relative; border-left: 1px solid var(--border); background: var(--bg);
  transition: background .28s, border-color .28s;
}
.dc.is-today { background: var(--today-bg); }
.hl {
  position: absolute; left: 0; right: 0; height: 64px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s;
}
.hl:hover { background: var(--hover-bg); }
.hhl { position: absolute; left: 0; right: 0; border-bottom: 1px dashed var(--border); opacity: .6; pointer-events: none; }

/* now line */
.now-l { position: absolute; left: 0; right: 0; height: 1.5px; background: var(--red); pointer-events: none; z-index: 8; }
.now-dot { position: absolute; left: -4px; top: -3.5px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; }

/* task block */
.tb {
  position: absolute; border-radius: 5px; padding: 5px 8px;
  cursor: pointer; border-left: 3px solid transparent; overflow: hidden; z-index: 5;
  transition: transform .1s, filter .1s;
}
.tb:hover { transform: translateX(1px); filter: brightness(1.06); }
.tb.done { opacity: .4; }
.tb-title { font-size: 11px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-time  { font-family: 'IBM Plex Mono', monospace; font-size: 9px; opacity: .65; margin-top: 2px; }
.tb-sub   { font-size: 9px; opacity: .55; margin-top: 1px; }
.tb-dl    { font-size: 9px; margin-top: 2px; }
.prog-bar  { height: 2px; background: rgba(128,128,128,.2); border-radius: 1px; margin-top: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 1px; transition: width .3s; }

/* ────────────────────────────
   MODAL
──────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px;
  width: 510px; max-height: 88vh; overflow-y: auto;
  transform: translateY(20px) scale(.98);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), background .28s, border-color .28s;
  box-shadow: 0 40px 90px rgba(0,0,0,.4), 0 0 0 1px rgba(100,80,200,.07);
}
.overlay.open .modal { transform: translateY(0) scale(1); }
.modal-top { padding: 20px 20px 0; display: flex; align-items: flex-start; gap: 10px; }
.m-title {
  flex: 1; background: none; border: none; outline: none;
  font-size: 19px; font-weight: 600; color: var(--text);
  font-family: 'DM Sans', sans-serif; resize: none; line-height: 1.2; transition: color .28s;
}
.m-title::placeholder { color: var(--muted); }
.m-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 3px; margin-top: 3px; transition: color .15s; line-height: 1; }
.m-close:hover { color: var(--text); }
.modal-body { padding: 14px 20px 0; }
.frow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.flbl { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; min-width: 66px; flex-shrink: 0; transition: color .28s; }
.finput {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text); border-radius: 7px;
  padding: 6px 10px; font-size: 12.5px; font-family: 'DM Sans', sans-serif; outline: none;
  transition: border-color .15s, background .28s, color .28s;
}
.finput:focus { border-color: var(--violet); }
.finput[type=date], .finput[type=time] { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }
.dl-finput { border-color: rgba(192,122,0,.4) !important; }
[data-theme="dark"] .dl-finput { border-color: rgba(255,190,74,.35) !important; }
.dl-finput:focus { border-color: var(--gold) !important; }
.dl-hint { font-size: 10.5px; }
.colors-row { display: flex; gap: 7px; flex-wrap: wrap; }
.co { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .13s, border-color .13s; flex-shrink: 0; }
.co:hover { transform: scale(1.2); }
.co.active { border-color: var(--text); }
.st-sec { margin-bottom: 12px; }
.st-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.st-cnt { font-size: 9px; color: var(--violet); font-family: 'IBM Plex Mono', monospace; margin-left: 4px; }
.st-add { background: none; border: 1px solid var(--border2); color: var(--muted); padding: 2px 9px; border-radius: 5px; cursor: pointer; font-size: 11px; font-family: 'DM Sans', sans-serif; transition: all .13s; }
.st-add:hover { border-color: var(--violet); color: var(--violet); }
.st-list { display: flex; flex-direction: column; gap: 5px; }
.st-item { display: flex; align-items: center; gap: 7px; background: var(--bg3); border-radius: 7px; padding: 7px 9px; transition: background .28s; }
.st-cb   { width: 14px; height: 14px; accent-color: var(--violet); cursor: pointer; flex-shrink: 0; }
.st-txt  { flex: 1; background: none; border: none; color: var(--text); font-size: 12.5px; font-family: 'DM Sans', sans-serif; outline: none; transition: color .28s; }
.st-txt.st-done { text-decoration: line-through; opacity: .45; }
.st-del  { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px; opacity: .5; transition: opacity .13s, color .13s; }
.st-del:hover { opacity: 1; color: var(--red); }
.notes-inp {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px;
  padding: 9px 11px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12.5px;
  resize: vertical; min-height: 65px; outline: none; transition: border-color .15s, background .28s, color .28s;
}
.notes-inp:focus { border-color: var(--violet); }
.modal-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-top: 1px solid var(--border);
  background: var(--foot-bg); border-radius: 0 0 16px 16px; margin-top: 16px;
  backdrop-filter: blur(8px); transition: background .28s, border-color .28s;
}
.done-lbl  { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.done-lbl input { accent-color: var(--green); }
.m-actions { display: flex; gap: 7px; }
.btn-del   { background: none; border: 1px solid rgba(212,31,68,.3); color: var(--red); padding: 6px 13px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-family: 'DM Sans', sans-serif; transition: all .13s; }
.btn-del:hover { background: rgba(212,31,68,.08); }
.btn-save  { background: var(--violet); color: #fff; border: none; padding: 6px 20px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500; font-family: 'DM Sans', sans-serif; transition: filter .13s, background .28s; }
.btn-save:hover { filter: brightness(1.1); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header class="hdr">
  <span class="logo">Дневник</span>
  <div class="week-nav">
    <button class="nbtn" onclick="changeWeek(-1)">‹</button>
    <span class="week-lbl" id="weekLbl"></span>
    <button class="nbtn" onclick="changeWeek(1)">›</button>
  </div>
  <button class="today-btn" onclick="goToday()">Сегодня</button>
  <div class="hdr-space"></div>

  <!-- theme toggle -->
  <div class="tog" onclick="toggleTheme()" title="Переключить тему">
    <div class="tog-track">
      <span class="tog-icon tog-moon">🌙</span>
      <span class="tog-icon tog-sun">☀️</span>
      <div class="tog-thumb"></div>
    </div>
  </div>

  <button class="add-btn" onclick="openModal(null)">＋ Задача</button>
</header>

<div class="body">
  <aside class="sidebar">
    <div class="mcal">
      <div class="mcal-hdr">
        <span class="mcal-title" id="mcTitle"></span>
        <div class="mcal-nav">
          <button class="mcal-nbtn" onclick="changeMiniMonth(-1)">‹</button>
          <button class="mcal-nbtn" onclick="changeMiniMonth(1)">›</button>
        </div>
      </div>
      <div class="mcal-grid" id="mcGrid"></div>
    </div>
    <div class="upcoming">
      <div class="sec-lbl">Дедлайны</div>
      <div id="dlList"></div>
    </div>
  </aside>

  <div class="main">
    <div class="day-hdrs" id="dayHdrs"><div class="dh-gutter"></div></div>
    <div class="grid-wrap" id="gridWrap">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-top">
      <textarea class="m-title" id="mTitle" placeholder="Название задачи..." rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey)event.preventDefault()"></textarea>
      <button class="m-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="frow">
        <span class="flbl">Дата</span>
        <input type="date" class="finput" id="mDate">
        <input type="time" class="finput" id="mStart" style="width:90px">
        <span style="color:var(--muted);font-size:11px">—</span>
        <input type="time" class="finput" id="mEnd" style="width:90px">
      </div>
      <div class="frow">
        <span class="flbl">Дедлайн</span>
        <input type="date" class="finput dl-finput" id="mDeadline" oninput="updateDlHint()">
        <span id="dlHint" class="dl-hint"></span>
      </div>
      <div class="frow">
        <span class="flbl">Цвет</span>
        <div class="colors-row" id="colorsRow"></div>
      </div>
      <div class="st-sec">
        <div class="st-hdr">
          <span class="flbl">Подзадачи<span class="st-cnt" id="stCnt"></span></span>
          <button class="st-add" onclick="addSt()">＋ добавить</button>
        </div>
        <div class="st-list" id="stList"></div>
      </div>
      <div style="margin-bottom:12px">
        <div class="flbl" style="margin-bottom:6px">Заметки</div>
        <textarea class="notes-inp" id="mNotes" placeholder="Описание, ссылки, детали..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <label class="done-lbl"><input type="checkbox" id="mDone"> Выполнено</label>
      <div class="m-actions">
        <button class="btn-del" id="btnDel" onclick="delTask()">Удалить</button>
        <button class="btn-save" onclick="saveTask()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
const HOUR_H=64, H_START=7, H_END=23;
const COLORS=['#7b5ff5','#ff5272','#ffbe4a','#3dd68c','#3dbeff','#ff7b42','#c45fe8','#ff9eb5'];
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS_R=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_S=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

let S={ tasks:[], weekStart:monOf(new Date()), miniMon:new Date(), editId:null, subtasks:[], color:COLORS[0] };

/* ── theme ── */
function toggleTheme(){
  const h=document.documentElement;
  const n=h.dataset.theme==='dark'?'light':'dark';
  h.dataset.theme=n;
  try{ localStorage.setItem('planner_theme',n); }catch(e){}
}
function loadTheme(){
  try{ const t=localStorage.getItem('planner_theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
}

/* ── storage ── */
function persist(){ try{ localStorage.setItem('planner_v2',JSON.stringify(S.tasks)); }catch(e){} }
function loadData(){
  try{ const r=localStorage.getItem('planner_v2'); if(r){ S.tasks=JSON.parse(r); return; } }catch(e){}
  const td=toStr(new Date()), tom=toStr(addD(new Date(),1));
  S.tasks=[
    {id:uid(),title:'Планирование недели',date:td,timeStart:'09:00',timeEnd:'09:30',deadline:tom,color:COLORS[0],subtasks:[{id:uid(),text:'Составить список задач',done:true},{id:uid(),text:'Расставить приоритеты',done:false}],notes:'',done:false},
    {id:uid(),title:'Встреча с командой',date:td,timeStart:'11:00',timeEnd:'12:00',deadline:'',color:COLORS[2],subtasks:[],notes:'Обсудить квартальный план',done:false},
    {id:uid(),title:'Обзор аналитики',date:tom,timeStart:'14:00',timeEnd:'15:30',deadline:toStr(addD(new Date(),3)),color:COLORS[4],subtasks:[{id:uid(),text:'Выгрузить данные',done:false},{id:uid(),text:'Сделать дашборд',done:false}],notes:'',done:false},
  ];
  persist();
}

/* ── utils ── */
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function monOf(d){ const dt=new Date(d),day=dt.getDay(); dt.setDate(dt.getDate()-(day===0?6:day-1)); dt.setHours(0,0,0,0); return dt; }
function addD(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt; }
function toStr(d){ return d.toISOString().slice(0,10); }
function todayStr(){ return toStr(new Date()); }
function pTime(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h+m/60; }
function fmtR(s,e){ return e?`${s} – ${e}`:s; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addH(t){ if(!t) return '10:00'; const [h,m]=t.split(':').map(Number); return `${String(Math.min(h+1,22)).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function diffD(iso){ const t=new Date(); t.setHours(0,0,0,0); return Math.floor((new Date(iso+'T00:00:00')-t)/86400000); }
function dlCls(iso){ if(!iso) return ''; const d=diffD(iso); return d<0?'overdue':d<=2?'soon':'ok'; }
function dlTxt(iso){ if(!iso) return ''; const d=diffD(iso); if(d<0) return `просрочен ${Math.abs(d)}д`; if(d===0) return 'сегодня'; if(d===1) return 'завтра'; return `через ${d}д`; }
function dlClr(iso){ const d=diffD(iso); return d<0?'var(--red)':d<=2?'var(--gold)':'var(--green)'; }

/* ── render header ── */
function renderHeader(){
  const e=addD(S.weekStart,6),s=S.weekStart;
  document.getElementById('weekLbl').textContent=s.getMonth()===e.getMonth()?`${s.getDate()} – ${e.getDate()} ${MON_S[e.getMonth()]} ${e.getFullYear()}`:`${s.getDate()} ${MON_S[s.getMonth()]} – ${e.getDate()} ${MON_S[e.getMonth()]} ${e.getFullYear()}`;
}

/* ── day headers ── */
function renderDayHdrs(){
  const c=document.getElementById('dayHdrs'); c.innerHTML='<div class="dh-gutter"></div>';
  const td=todayStr();
  for(let i=0;i<7;i++){
    const d=addD(S.weekStart,i),ds=toStr(d);
    const n=S.tasks.filter(t=>t.date===ds).length;
    const div=document.createElement('div');
    div.className='dh'+(ds===td?' is-today':'');
    div.innerHTML=`<div class="dh-name">${DOW[i]}</div><div class="dh-num">${d.getDate()}</div><div class="dh-tc">${n>0?n+(n===1?' задача':n<5?' задачи':' задач'):''}</div>`;
    div.onclick=()=>openModal(null,ds,'09:00');
    c.appendChild(div);
  }
}

/* ── grid ── */
function renderGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  const totalH=(H_END-H_START)*HOUR_H;
  const tc=document.createElement('div'); tc.className='time-col'; tc.style.height=totalH+'px';
  for(let h=H_START;h<H_END;h++){
    const l=document.createElement('div'); l.className='tl'; l.textContent=`${String(h).padStart(2,'0')}:00`; tc.appendChild(l);
  }
  g.appendChild(tc);
  const dcw=document.createElement('div'); dcw.className='day-cols'; dcw.style.height=totalH+'px';
  const td=todayStr();
  for(let i=0;i<7;i++){
    const d=addD(S.weekStart,i),ds=toStr(d);
    const col=document.createElement('div'); col.className='dc'+(ds===td?' is-today':''); col.dataset.date=ds;
    for(let h=H_START;h<H_END;h++){
      const top=(h-H_START)*HOUR_H;
      const hl=document.createElement('div'); hl.className='hl'; hl.style.top=top+'px';
      hl.onclick=(e)=>{if(e.target===hl) openModal(null,ds,`${String(h).padStart(2,'0')}:00`);};
      col.appendChild(hl);
      const hhl=document.createElement('div'); hhl.className='hhl'; hhl.style.top=(top+HOUR_H/2)+'px'; col.appendChild(hhl);
    }
    posTasks(S.tasks.filter(t=>t.date===ds)).forEach(({task,c,cols})=>col.appendChild(mkBlock(task,c,cols)));
    if(ds===td){
      const now=new Date(),nh=now.getHours()+now.getMinutes()/60;
      if(nh>=H_START&&nh<H_END){
        const nl=document.createElement('div'); nl.className='now-l'; nl.style.top=((nh-H_START)*HOUR_H)+'px';
        const dot=document.createElement('div'); dot.className='now-dot'; nl.appendChild(dot); col.appendChild(nl);
      }
    }
    dcw.appendChild(col);
  }
  g.appendChild(dcw);
}

function posTasks(tasks){
  if(!tasks.length) return [];
  const sorted=[...tasks].sort((a,b)=>pTime(a.timeStart)-pTime(b.timeStart));
  const slots=[],result=[];
  for(const task of sorted){
    const ts=pTime(task.timeStart||'08:00'),te=pTime(task.timeEnd||'')||Math.min(ts+1,H_END);
    let ci=slots.findIndex(s=>s<=ts); if(ci===-1){ci=slots.length;slots.push(0);} slots[ci]=te;
    result.push({task,c:ci});
  }
  const mc=slots.length;
  return result.map(r=>({...r,cols:mc}));
}

function mkBlock(task,ci,nc){
  const ts=pTime(task.timeStart||'08:00'),te=pTime(task.timeEnd||'')||Math.min(ts+1,H_END);
  const top=(ts-H_START)*HOUR_H,height=Math.max((te-ts)*HOUR_H-2,22);
  const b=document.createElement('div');
  b.className='tb'+(task.done?' done':'');
  b.style.cssText=`top:${top}px;height:${height}px;left:calc(${ci/nc*100}% + 2px);width:calc(${1/nc*100}% - 4px);background:${task.color}1c;border-left-color:${task.color};`;
  const done=(task.subtasks||[]).filter(s=>s.done).length,total=(task.subtasks||[]).length;
  const pct=total>0?(done/total*100).toFixed(0):0,short=height<44;
  let dl='';
  if(task.deadline){const df=diffD(task.deadline);if(df<0)dl=`<div class="tb-dl" style="color:var(--red)">⚠ просрочен</div>`;else if(df===0)dl=`<div class="tb-dl" style="color:var(--gold)">⏰ сегодня</div>`;else if(df<=2)dl=`<div class="tb-dl" style="color:var(--gold)">⏰ ${df}д</div>`;}
  b.innerHTML=`<div class="tb-title" style="color:${task.color}">${esc(task.title)||'Без названия'}</div>${!short?`<div class="tb-time">${fmtR(task.timeStart,task.timeEnd)}</div>`:''}${total>0&&!short?`<div class="tb-sub">✓ ${done}/${total}</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${task.color}"></div></div>`:''}${dl}`;
  b.onclick=()=>openModal(task);
  return b;
}

/* ── mini cal ── */
function renderMiniCal(){
  const mc=S.miniMon;
  document.getElementById('mcTitle').textContent=`${MONTHS_R[mc.getMonth()]} ${mc.getFullYear()}`;
  const grid=document.getElementById('mcGrid'); grid.innerHTML='';
  DOW.forEach(d=>{const el=document.createElement('div');el.className='mcal-dow';el.textContent=d;grid.appendChild(el);});
  const td=todayStr(),first=new Date(mc.getFullYear(),mc.getMonth(),1),offset=(first.getDay()+6)%7;
  const dim=new Date(mc.getFullYear(),mc.getMonth()+1,0).getDate(),pl=new Date(mc.getFullYear(),mc.getMonth(),0).getDate();
  const ws=toStr(S.weekStart),we=toStr(addD(S.weekStart,6));
  for(let i=0;i<offset;i++){const el=document.createElement('div');el.className='md';el.textContent=pl-offset+i+1;grid.appendChild(el);}
  for(let day=1;day<=dim;day++){
    const dt=new Date(mc.getFullYear(),mc.getMonth(),day),ds=toStr(dt);
    const ht=S.tasks.some(t=>t.date===ds),it=ds===td,iw=ds>=ws&&ds<=we;
    const el=document.createElement('div');
    el.className='md in-m'+(it?' is-today':iw?' in-week':'')+(ht?' has-t':'');
    el.textContent=day; el.title=ht?`${S.tasks.filter(t=>t.date===ds).length} задач`:'';
    el.onclick=()=>{S.weekStart=monOf(dt);renderAll();};
    grid.appendChild(el);
  }
}

/* ── deadline list ── */
function renderDlList(){
  const list=document.getElementById('dlList');
  const items=S.tasks.filter(t=>t.deadline&&!t.done).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  if(!items.length){list.innerHTML='<div class="empty-msg">Нет активных дедлайнов</div>';return;}
  list.innerHTML='';
  items.forEach(task=>{
    const div=document.createElement('div');
    div.className='dl-item '+dlCls(task.deadline);
    div.innerHTML=`<div class="dl-title">${esc(task.title)||'Без названия'}</div><div class="dl-meta"><span class="dl-date">${task.deadline}</span><span style="color:${dlClr(task.deadline)}">${dlTxt(task.deadline)}</span></div>`;
    div.onclick=()=>openModal(task);
    list.appendChild(div);
  });
}

/* ── modal ── */
function renderColors(sel){
  const row=document.getElementById('colorsRow');row.innerHTML='';
  COLORS.forEach(c=>{const el=document.createElement('div');el.className='co'+(c===sel?' active':'');el.style.background=c;el.onclick=()=>{S.color=c;renderColors(c);};row.appendChild(el);});
}
function renderStList(){
  const list=document.getElementById('stList');list.innerHTML='';
  const done=S.subtasks.filter(s=>s.done).length;
  document.getElementById('stCnt').textContent=S.subtasks.length?` ${done}/${S.subtasks.length}`:'';
  S.subtasks.forEach((st,i)=>{
    const item=document.createElement('div');item.className='st-item';
    item.innerHTML=`<input type="checkbox" class="st-cb" ${st.done?'checked':''} onchange="toggleSt(${i},this.checked)"><input type="text" class="st-txt${st.done?' st-done':''}" value="${esc(st.text)}" placeholder="Подзадача..." oninput="updateSt(${i},this.value)" onkeydown="stKey(event,${i})"><button class="st-del" onclick="removeSt(${i})">✕</button>`;
    list.appendChild(item);
  });
}
function addSt(){S.subtasks.push({id:uid(),text:'',done:false});renderStList();setTimeout(()=>{const i=document.querySelectorAll('.st-txt');if(i.length)i[i.length-1].focus();},30);}
function removeSt(i){S.subtasks.splice(i,1);renderStList();}
function toggleSt(i,v){S.subtasks[i].done=v;renderStList();}
function updateSt(i,v){S.subtasks[i].text=v;const d=S.subtasks.filter(s=>s.done).length;document.getElementById('stCnt').textContent=S.subtasks.length?` ${d}/${S.subtasks.length}`:''; }
function stKey(e,i){if(e.key==='Enter'){e.preventDefault();addSt();}if(e.key==='Backspace'&&!S.subtasks[i].text){e.preventDefault();removeSt(i);}}
function updateDlHint(){
  const v=document.getElementById('mDeadline').value,hint=document.getElementById('dlHint');
  if(!v){hint.textContent='';return;}
  const d=diffD(v);
  if(d<0){hint.textContent=`⚠ просрочен на ${Math.abs(d)} дн`;hint.style.color='var(--red)';}
  else if(d===0){hint.textContent='⏰ сегодня';hint.style.color='var(--gold)';}
  else if(d<=2){hint.textContent=`⏰ через ${d} дн`;hint.style.color='var(--gold)';}
  else{hint.textContent=`через ${d} дн`;hint.style.color='var(--green)';}
}
function openModal(task,date,time){
  S.editId=task?task.id:null;
  S.subtasks=task?JSON.parse(JSON.stringify(task.subtasks||[])):[];
  S.color=task?task.color:COLORS[0];
  const dd=date||toStr(S.weekStart),dt=time||'09:00';
  document.getElementById('mTitle').value=task?task.title:'';
  document.getElementById('mDate').value=task?task.date:dd;
  document.getElementById('mStart').value=task?task.timeStart:dt;
  document.getElementById('mEnd').value=task?task.timeEnd:addH(dt);
  document.getElementById('mDeadline').value=task?(task.deadline||''):'';
  document.getElementById('mNotes').value=task?(task.notes||''):'';
  document.getElementById('mDone').checked=!!task?.done;
  document.getElementById('btnDel').style.display=task?'':'none';
  updateDlHint();renderColors(S.color);renderStList();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('mTitle').focus(),80);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}
function saveTask(){
  const title=document.getElementById('mTitle').value.trim();
  if(!title){document.getElementById('mTitle').style.outline='2px solid var(--red)';document.getElementById('mTitle').focus();setTimeout(()=>document.getElementById('mTitle').style.outline='',1500);return;}
  const data={id:S.editId||uid(),title,date:document.getElementById('mDate').value,timeStart:document.getElementById('mStart').value,timeEnd:document.getElementById('mEnd').value,deadline:document.getElementById('mDeadline').value,color:S.color,subtasks:S.subtasks.filter(s=>s.text.trim()),notes:document.getElementById('mNotes').value,done:document.getElementById('mDone').checked};
  if(S.editId){const idx=S.tasks.findIndex(t=>t.id===S.editId);if(idx>=0)S.tasks[idx]=data;else S.tasks.push(data);}else S.tasks.push(data);
  persist();closeModal();renderAll();
}
function delTask(){if(!S.editId||!confirm('Удалить задачу?'))return;S.tasks=S.tasks.filter(t=>t.id!==S.editId);persist();closeModal();renderAll();}

/* ── nav ── */
function changeWeek(d){S.weekStart=addD(S.weekStart,d*7);renderAll();}
function changeMiniMonth(d){S.miniMon=new Date(S.miniMon.getFullYear(),S.miniMon.getMonth()+d,1);renderMiniCal();}
function goToday(){
  S.weekStart=monOf(new Date());S.miniMon=new Date();renderAll();
  const now=new Date(),nh=now.getHours()+now.getMinutes()/60;
  if(nh>=H_START)setTimeout(()=>document.getElementById('gridWrap').scrollTo({top:Math.max(0,(nh-H_START-1)*HOUR_H),behavior:'smooth'}),50);
}

/* ── render all ── */
function renderAll(){renderHeader();renderDayHdrs();renderGrid();renderMiniCal();renderDlList();}

/* ── now line ── */
function tickNow(){const now=new Date(),nh=now.getHours()+now.getMinutes()/60;if(nh<H_START||nh>=H_END)return;document.querySelectorAll('.now-l').forEach(l=>l.style.top=((nh-H_START)*HOUR_H)+'px');}
setInterval(tickNow,30000);

/* ── keyboard ── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.getElementById('overlay').classList.contains('open'))saveTask();
  if((e.ctrlKey||e.metaKey)&&e.key==='ArrowLeft')changeWeek(-1);
  if((e.ctrlKey||e.metaKey)&&e.key==='ArrowRight')changeWeek(1);
});

/* ── init ── */
loadTheme();
loadData();
renderAll();
setTimeout(()=>document.getElementById('gridWrap').scrollTop=(9-H_START)*HOUR_H,100);
</script>
</body>
